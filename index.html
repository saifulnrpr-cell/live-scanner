<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#111827">
  <title>Live Barcode Scanner</title>
  <script src="https://unpkg.com/html5-qrcode" defer></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:Arial,"Noto Sans Thai",sans-serif;background:#111827;color:#fff}
    .wrap{width:min(100%,560px);margin:auto;padding:14px}
    .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
    h1{font-size:22px;margin:0}
    button{border:0;border-radius:14px;padding:12px 16px;font-size:16px;font-weight:700}
    #closeBtn{background:#ef4444;color:#fff;font-size:24px;width:48px;height:48px;padding:0;cursor:pointer;}
    .reader-wrap{position:relative;overflow:hidden;border-radius:18px;background:#000;min-height:300px;border:2px solid #f97316}
    #reader{width:100%;min-height:300px}
    #reader video{width:100%!important;height:auto!important;object-fit:cover}
    .guide{position:absolute;left:8%;right:8%;top:50%;height:105px;transform:translateY(-50%);border:3px solid #f97316;border-radius:12px;pointer-events:none;box-shadow:0 0 0 9999px rgba(0,0,0,.28)}
    .status{margin-top:12px;padding:12px;border-radius:12px;background:#1f2937;color:#dbeafe;line-height:1.45;word-break:break-word}
    .error{background:#7f1d1d;color:#fee2e2}
    .success{background:#14532d;color:#dcfce7}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
    .primary{background:#f97316;color:#fff;cursor:pointer;}
    .secondary{background:#374151;color:#fff;cursor:pointer;}
    .small{font-size:12px;opacity:.75;margin-top:12px;text-align:center}
    #debug{display:none;font-size:11px;white-space:pre-wrap;background:#030712;color:#d1d5db;padding:8px;border-radius:8px;margin-top:8px}
  </style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <h1>📷 Live Scanner</h1>
    <button id="closeBtn" aria-label="ปิด">×</button>
  </div>

  <div class="reader-wrap">
    <div id="reader"></div>
    <div class="guide"></div>
  </div>

  <div id="status" class="status">
    กำลังเตรียมเปิดกล้อง...
  </div>
  <div id="debug"></div>

  <div class="actions">
    <button id="retryBtn" class="primary">📷 เปิดกล้องใหม่</button>
    <button id="closeBtn2" class="secondary">ปิดหน้าต่าง</button>
  </div>

  <div class="small">
    อนุญาตให้เบราว์เซอร์เข้าถึงกล้อง เพื่อสแกนบาร์โค้ด
  </div>
</main>

<script>
const params = new URLSearchParams(location.search);
const token = params.get('token') || '';
// เพิ่ม parameter สำหรับตรวจสอบว่าให้ค้นหาอัตโนมัติหรือไม่
const autoSearchParam = params.get('autoSearch') || '0'; 

let scanner = null;
let running = false;
let sent = false;

const statusEl = document.getElementById('status');
const debugEl = document.getElementById('debug');

function setStatus(message, type) {
  statusEl.textContent = message;
  statusEl.className = 'status ' +
    (type === 'error' ? 'error' : type === 'success' ? 'success' : '');
}

function debug(message) {
  console.log(message);
  debugEl.textContent = String(message);
}

function send(payload) {
  if (window.opener && !window.opener.closed) {
    window.opener.postMessage(payload, '*');
  }
}

function getFormats() {
  const f = window.Html5QrcodeSupportedFormats;
  if (!f) return undefined;
  return [
    f.EAN_13, f.EAN_8, f.UPC_A, f.UPC_E,
    f.CODE_128, f.CODE_39, f.ITF, f.QR_CODE
  ].filter(Boolean);
}

async function stopScanner() {
  if (!scanner || !running) return;
  running = false;
  try { await scanner.stop(); } catch (e) {}
}

async function warmUpCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: 'environment' } },
    audio: false
  });

  const track = stream.getVideoTracks()[0];
  const settings = track && track.getSettings ? track.getSettings() : {};
  const deviceId = settings.deviceId || '';

  stream.getTracks().forEach(t => t.stop());

  return deviceId;
}

async function startScanner() {
  sent = false;
  await stopScanner();

  if (!window.isSecureContext) {
    const msg = 'หน้านี้ไม่ใช่ HTTPS';
    setStatus(msg, 'error');
    send({type:'scanner-error', token, message:msg});
    return;
  }

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    const msg = 'เบราว์เซอร์ไม่รองรับกล้อง';
    setStatus(msg, 'error');
    send({type:'scanner-error', token, message:msg});
    return;
  }

  // รอจนกว่าไลบรารีจะโหลดเสร็จ
  let waitCount = 0;
  while (typeof Html5Qrcode === 'undefined' && waitCount < 10) {
      await new Promise(resolve => setTimeout(resolve, 300));
      waitCount++;
  }

  if (typeof Html5Qrcode === 'undefined') {
    const msg = 'โหลดเครื่องมือสแกนไม่สำเร็จ กรุณากดเปิดกล้องใหม่';
    setStatus(msg, 'error');
    return;
  }

  setStatus('กำลังขอสิทธิ์เปิดกล้อง...', '');

  let deviceId = '';
  try {
    deviceId = await warmUpCamera();
  } catch (e) {
    console.error(e);
    const name = e && e.name ? e.name : 'UnknownError';
    let msg = 'เปิดกล้องไม่ได้ กรุณาอนุญาตสิทธิ์';
    setStatus(msg, 'error');
    send({type:'scanner-error', token, message:msg});
    return;
  }

  if (!scanner) scanner = new Html5Qrcode('reader');

  const config = {
    fps: 15,
    qrbox: {width: 280, height: 120},
    aspectRatio: 1.7777778
  };

  const formats = getFormats();
  if (formats && formats.length) config.formatsToSupport = formats;

  try {
    if (deviceId) {
      await scanner.start(deviceId, config, onSuccess, () => {});
    } else {
      await scanner.start( {facingMode: 'environment'}, config, onSuccess, () => {} );
    }

    running = true;
    setStatus('กล้องพร้อมแล้ว — จ่อบาร์โค้ดให้ตรงกรอบ', 'success');
    send({type:'scanner-ready', token});
  } catch (e) {
    console.error(e);
    
    try {
      const cameras = await Html5Qrcode.getCameras();
      if (cameras && cameras.length) {
        const preferred = cameras.find(c => /back|rear|environment|หลัง/i.test(c.label)) || cameras[cameras.length - 1];
        await scanner.start(preferred.id, config, onSuccess, () => {});
        running = true;
        setStatus('กล้องพร้อมแล้ว — จ่อบาร์โค้ดให้ตรงกรอบ', 'success');
        send({type:'scanner-ready', token});
        return;
      }
    } catch (fallbackError) {
      console.error(fallbackError);
    }

    const msg = 'ระบบสแกนยังเปิดกล้องไม่ได้ ลองเปิดกล้องใหม่อีกครั้ง';
    setStatus(msg, 'error');
    send({type:'scanner-error', token, message:msg});
  }
}

function onSuccess(decodedText) {
  if (sent) return;

  const barcode = String(decodedText || '').trim();
  if (!barcode) return;

  sent = true;
  setStatus('พบ Barcode: ' + barcode + ' — กำลังส่งกลับ...', 'success');

  // ส่ง parameter กลับไปด้วย เพื่อให้หน้าเว็บหลักรู้ว่าต้องค้นหาอัตโนมัติหรือไม่
  send({
    type:'barcode-scanned',
    token,
    barcode,
    autoSearch: autoSearchParam
  });

  stopScanner().finally(() => {
    setTimeout(() => { try { window.close(); } catch(e) {} }, 300);
  });
}

document.getElementById('retryBtn').addEventListener('click', startScanner);
document.getElementById('closeBtn').addEventListener('click', closeScanner);
document.getElementById('closeBtn2').addEventListener('click', closeScanner);

async function closeScanner() {
  await stopScanner();
  try { window.close(); } catch(e) {}
}

window.addEventListener('beforeunload', () => {
  try { if (scanner && running) scanner.stop(); } catch(e) {}
});

// เริ่มสแกนเนอร์อัตโนมัติเมื่อโหลดเว็บเสร็จ
window.addEventListener('load', () => {
    // หน่วงเวลาเล็กน้อยเพื่อให้หน้าต่างเตรียมพร้อม
    setTimeout(startScanner, 200);
});
</script>
</body>
</html>
